<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="browser-background">
        <div class="main-background">
            <header>
                <div class="header-content">
                    <img src="/Imagenes/1.jpg" alt="Imagen Referencial">
                    <div class="header-text">
                        <h1>Texto o Contenido Relacionado</h1>
                    </div>
                </div>
                <nav>
                    <ul>
                        <li><a href="#">Navegación 1</a></li>
                        <li><a href="#">Navegación 2</a></li>
                        <li><a href="#">Navegación 3</a></li>
                    </ul>
                </nav>
            </header>
            <div class="container">
                <aside>
                    <h2>Aside</h2>
                    <p>Contenido del Aside</p>
                </aside>
                <main>
                    <article>
                        <h2>Article 1</h2>
                        <p>Contenido del Artículo 1</p>
                    </article>
                    <article>
                        <h2>Article 2</h2>
                        <p>Contenido del Artículo 2</p>
                    </article>
                    <div class="image-gallery">
                        <img src="/Imagenes/1.jpg" alt="Imagen 1">
                        <img src="/Imagenes/2.jpg" alt="Imagen 2">
                        <img src="/Imagenes/3.jpg" alt="Imagen 3">
                        <img src="/Imagenes/4.jpg" alt="Imagen 4">
                    </div>
                </main>
            </div>
            <footer>
                <div class="footer-content">
                    <p>Contenido Footer 1</p>
                    <p>Contenido Footer 2</p>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
